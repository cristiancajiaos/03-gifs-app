<div id="nav" class="w-full px-6">
  @for (menuOption of menuOptions; track menuOption.route) {
    <a
      href="#"
      class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150"
      [routerLink]="menuOption.route"
      routerLinkActive="bg-blue-800"
    >
      <div>
        <i [ngClass]="menuOption.icon"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-lg font-bold leading-5 text-white">{{menuOption.label}}</span>
        <span class="text-sm text-white/50 hidden md:block">{{menuOption.sublabel}}</span>
      </div>
    </a>
  }
  @for (key of gifsService.searchHistoryKeys(); track key) {
    <a
      href="#"
      class="w-full px-2 inline-flex space-x-2 items-center border-b border-slate-700 py-3 hover:bg-white/5 transition ease-linear duration-150"
      [routerLink]="['/dashboard/search']"
      routerLinkActive="bg-blue-800"
    >
      <div>
        <i class="fa-solid fa-clock-rotate-left"></i>
      </div>
      <div class="flex flex-col">
        <span class="text-lg font-bold leading-5 text-white">{{key}}</span>
      </div>
    </a>
  }
</div>
